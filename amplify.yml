version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install exact dependencies with cached offline preference for fast builds
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Build the production bundle (Vite SPA + Server bundle)
        - npm run build
  artifacts:
    # Amplify serves the compiled frontend assets from the dist directory
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'
        - key: 'X-Frame-Options'
          value: 'SAMEORIGIN'
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'Referrer-Policy'
          value: 'strict-origin-when-cross-origin'
